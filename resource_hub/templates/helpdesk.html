{% extends "base.html" %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
    <h1>Submit a Ticket</h1>
    <p class="subtitle">Need help? Open an IT or Facilities support ticket.</p>

    <form action="/api/tickets" method="POST">
        <div class="form-group">
            <label for="title">Issue Summary</label>
            <input type="text" id="title" name="title" required placeholder="e.g. Broken projector in Alpha Room">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required placeholder="Provide more details about the issue..."></textarea>
        </div>

        <div class="form-group">
            <label for="creator_id">Requester (You)</label>
            <select id="creator_id" name="creator_id" required>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Submit Ticket</button>
    </form>
</div>
{% endblock %}
